[package]
name = "whut-wifi-maintainer"
version = "0.2.4"
edition = "2024"

[dependencies]
base64 = "0.22"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "json", "rustls-tls"] }
rsa = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

# Windows 平台专用依赖：Linux/OpenWrt 构建不会引入。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", default-features = false, features = ["Networking_Connectivity", "Win32_System_WinRT"] }
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
