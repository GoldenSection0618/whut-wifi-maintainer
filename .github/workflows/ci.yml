name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['maintainer/**']

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo +stable fmt --all -- --check
      - name: Run tests
        run: cargo +stable test --locked
      - name: Build release
        run: cargo +stable build --release --locked
      - name: Install .NET SDK
        if: matrix.os == 'windows-latest'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Package Windows desktop app
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $publish = Join-Path $env:RUNNER_TEMP 'whut-wifi-winui'
          ./windows/package.ps1 -OutputDirectory $publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zip = Join-Path $env:RUNNER_TEMP 'whut-wifi-maintainer-windows-x64.zip'
          Compress-Archive -Path (Join-Path $publish '*') -DestinationPath $zip
      - name: Upload Windows ZIP
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/whut-wifi-maintainer-windows-x64.zip
          archive: false
          if-no-files-found: error
